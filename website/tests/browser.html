function checkResourceStrip(document, context) {
  const scale = document.defaultView.devicePixelRatio;

  assert(cells.length === 3, `the summary retains its three labelled observations: ${context}`);
  const boxes = cells.map(cell => cell.getBoundingClientRect());
  const columns = boxes.every(box => paintedPixel(scale, box.top) === paintedPixel(scale, boxes[0].top));
  const owner = document.querySelector('[data-run-summary]');
  const style = document.defaultView.getComputedStyle(owner);
  const availableWidth = owner.getBoundingClientRect().width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight) - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth);
  const wide = availableWidth >= 50 * parseFloat(document.defaultView.getComputedStyle(document.documentElement).fontSize);
  assert(columns === wide, `metrics use narrow rows and wide columns: ${context}`);
  for (const [index, cell] of cells.entries()) {
    const box = boxes[index];
    for (const field of cell.querySelectorAll('dt,dd')) {
      const range = document.createRange(); range.selectNodeContents(field);
      for (const line of range.getClientRects()) {

function relativeLuminance(color) {
  const channels = color.match(/^rgb\((\d+), (\d+), (\d+)\)$/);
  assert(channels, `expected opaque computed RGB: ${color}`);
  const [red, green, blue] = channels.slice(1).map((channel) => {

    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;

async function checkCompactRunStates(frame, preset) {
  const savedWidth = frame.style.width;
  const document = frame.contentDocument;
  const runner = document.querySelector('[data-runner]');
  const input = runner.querySelector('textarea');
  const run = runner.querySelector('[data-run]');
  const output = runner.querySelector('.run-output');
  const result = runner.querySelector('.runner-result');
  const summary = runner.querySelector('[data-run-summary]');
  const observations = [];
  frame.style.width = '390px';
  runner.querySelector('[data-run-language="javascript"]').click();
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  checkResultPlacement(document, 'compact initial state');
  for (const scenario of [
    { state: 'complete', source: preset },
    { state: 'error', source: preset + '\nthrow new Error("compact failure");' },
    { state: 'stopped', source: 'console.log("compact pending"); await new Promise(() => {});' },
  ]) {
    input.value = scenario.source;
    input.dispatchEvent(new Event('input', { bubbles: true }));
    run.click();
    assert(runner.dataset.state !== 'idle' && result.getClientRects().length, 'starting a compact run keeps its full result and measurement panel visible');
    if (scenario.state === 'stopped') {
      await until(() => output.textContent.includes('compact pending'), 'compact pending output');
      runner.querySelector('[data-stop]').click();
    }
    await until(() => !run.disabled, `compact ${scenario.state} settled`);
    assert(runner.dataset.state === scenario.state && result.getClientRects().length, `compact ${scenario.state} retains its visible result`);
    assert(runner.querySelector('[data-run-summary]') === summary && summary.getClientRects().length, 'all compact run states retain the same complete measurement component');
    if (scenario.state !== 'stopped') {
      assert(output.textContent.includes('[-2,4]'), 'success and failure preserve the actual computed compact output');
      assert(summary.querySelector('[data-resource-memory]').textContent !== 'No run yet', 'settled compact runs retain their observations');
    }
    if (scenario.state === 'error') assert(runner.querySelector('[data-error-details]').textContent.includes('compact failure'), 'compact failure keeps the original error');
    checkResultPlacement(document, `compact ${scenario.state}`);
    checkResourceStrip(document, `compact ${scenario.state}`);
    observations.push({ state: scenario.state, output: output.textContent.trim(), peak: summary.querySelector('[data-resource-memory]').textContent });
    runner.querySelector('[data-restore]').click();
    assert(runner.dataset.state === 'idle', 'Reset restores the unexecuted compact example');
    checkResultPlacement(document, `compact reset after ${scenario.state}`);
  }
  frame.style.width = '1280px';
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const console = runner.querySelector('.run-console');
  frame.focus(); console.focus();
  assert(document.activeElement === console, 'the wide initial result can receive keyboard focus');
  frame.style.width = '390px';
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  assert(document.activeElement === console && result.getClientRects().length, 'narrowing preserves a focused initial result');
  input.focus();
  assert(document.activeElement === input && result.getClientRects().length && summary.getClientRects().length, 'moving focus to the initial editor preserves all result and measurement controls');
  runner.querySelector('[data-run-language="python"]').click();
  frame.style.width = savedWidth;
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  return observations;
}

async function checkSearch(document, path) {

function checkUseCaseCards(document, context) {
  const cards = [...document.querySelectorAll('.use-cases .example-gallery > a')];
  const scale = document.defaultView.devicePixelRatio;
  const rows = new Map();
  for (const card of cards) {
    const top = paintedPixel(scale, card.getBoundingClientRect().top);
    const row = rows.get(top) ?? []; row.push(card); rows.set(top, row);
  }
  for (const row of rows.values()) {
    const boxes = row.map(card => card.getBoundingClientRect());
    const widths = boxes.map(box => paintedPixel(scale, box.width));
    assert(Math.max(...widths) - Math.min(...widths) <= 1, `use-case cards share the available width: ${context}`);
    const gaps = boxes.slice(1).map((box, index) => paintedPixel(scale, box.left - boxes[index].right));
    assert(gaps.every(gap => gap === gaps[0]), `use-case cards have equal gutters: ${context}`);
    for (const selector of ['.example-card-art', 'h3', 'p', 'strong']) {
      const positions = row.map(card => paintedPixel(scale, card.querySelector(selector).getBoundingClientRect().top));
      assert(new Set(positions).size === 1, `use-case content aligns within each row despite different text lengths: ${context}; ${selector}`);
    }
  }
}

      await until(() => !menu.matches(':popover-open'), `resize closes a hidden navigation: ${selector}`);
    }
  }
  const footerNavigation = await checkFooterNavigation(frame);
  const sponsorshipNavigation = await checkSponsorshipNavigation(frame);
  frame.src = selectedExampleUrl;
  await until(() => frame.contentDocument?.querySelector('[data-example="matrix-products"][aria-pressed="true"]') && frame.contentDocument.querySelector('[data-run-language="javascript"][aria-selected="true"]') && frame.contentDocument.querySelector('[data-run-device="webgpu"][aria-pressed="true"]'), 'a fresh page restores selection from the address');
  results.push({ name: "primary/project pages and documentation at ten widths, native navigation, responsive retirement, sidebar/code boundaries, non-overlapping controls and increased text spacing", passed: true, navigationFocus, searchChecks, pageRender, footerNavigation, sponsorshipNavigation });
  await phase("runtime-finished");
  const report = { passed: true, cases: results };
  document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
  if (token) await fetch(`/__result?token=${encodeURIComponent(token)}`, { method: "POST", body: JSON.stringify(report) });
} catch (error) {
  const report = { passed: false, error: String(error), cases: results };
  document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
  if (token) await fetch(`/__result?token=${encodeURIComponent(token)}`, { method: "POST", body: JSON.stringify(report) });
}
