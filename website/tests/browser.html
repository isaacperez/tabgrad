function relativeLuminance(color) {

    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;

        const separation = sectionHeadings[1].getBoundingClientRect().top - reference.getBoundingClientRect().bottom;
        assert(separation >= parseFloat(frame.contentWindow.getComputedStyle(reference).lineHeight), `compatibility sections retain a line of separation at ${width}px`);
        const capabilities = document.querySelectorAll('.capability-row');
        assert(capabilities.length === 4 && [...capabilities].every(row => row.querySelector('h3') && row.querySelector('a[href^="/docs/"]')), 'each capability group has an explanation and an actionable reference');
        assert(document.querySelectorAll('.release-limits > div').length === 4, 'release limits remain explicit, separate from available capabilities');
        const [cpu, gpu] = document.querySelectorAll('.compatibility-grid article');
        if (cpu.getBoundingClientRect().right <= gpu.getBoundingClientRect().left) {
          const cpuSetup = cpu.querySelectorAll('dt')[1].getBoundingClientRect();
          const gpuSetup = gpu.querySelectorAll('dt')[1].getBoundingClientRect();
          assert(Math.abs(cpuSetup.top - gpuSetup.top) < 1, 'backend setup rows align despite different explanation lengths');
        }
        for (const row of capabilities) {
          const title = row.querySelector('h3').getBoundingClientRect();
          const detail = row.querySelector('p').getBoundingClientRect();
          assert(width >= 1120 ? title.right <= detail.left : title.bottom <= detail.top, `capability text retains independent space at ${width}px`);
        }
      }
      if (path === '/start/') {
        for (const code of document.querySelectorAll('.expressive-code pre')) assert(code.scrollWidth <= code.clientWidth, `introductory code wraps without horizontal scrolling at ${width}px`);
        const example = document.getElementById('html');
        const map = document.querySelector('.integration-map');
        assert(example.compareDocumentPosition(map) & Node.DOCUMENT_POSITION_FOLLOWING, 'working HTML precedes the architecture explanation');
        example.scrollIntoView();
        assert(example.getBoundingClientRect().top >= document.querySelector('header.header').getBoundingClientRect().bottom, `HTML destination clears the sticky header at ${width}px`);
        frame.contentWindow.scrollTo(0, 0);
      }
      for (const codeFrame of document.querySelectorAll('.expressive-code .frame')) {
        assert(frame.contentWindow.getComputedStyle(codeFrame).boxShadow === 'none', `static code does not retain a theme shadow: ${path}`);
        const tab = codeFrame.querySelector('.title');
        if (tab && codeFrame.classList.contains('has-title') && !codeFrame.classList.contains('is-terminal')) {
          const indicator = frame.contentWindow.getComputedStyle(tab, '::after');
          assert(parseFloat(indicator.borderTopWidth) === 0 && parseFloat(indicator.borderBottomWidth) === 0, `static code does not retain a tab accent: ${path}`);
          const header = codeFrame.querySelector('.header');
          assert(parseFloat(frame.contentWindow.getComputedStyle(tab).borderTopLeftRadius) >= parseFloat(frame.contentWindow.getComputedStyle(header).borderTopLeftRadius), `title background respects the frame corner: ${path}`);
        }
      }
      for (const link of document.querySelectorAll('.tabgrad-navigation a, .site-menu-links a')) {
        assert(frame.contentWindow.getComputedStyle(link).backgroundColor === 'rgba(0, 0, 0, 0)', 'text navigation has no competing background treatment');
      }
      if (path === '/start/') for (const label of document.querySelectorAll('.integration-map strong, .integration-map span')) {
        assert(parseFloat(frame.contentWindow.getComputedStyle(label).fontSize) >= 14, `integration labels remain native readable text at ${width}px`);
      }
      if (path === '/' && width === 1280) {
        const examplesSection = document.querySelector('.explore-section');
        const examplesHeading = document.getElementById(examplesSection.getAttribute('aria-labelledby'));
        const gallery = examplesSection.querySelector('.example-gallery');
        assert(examplesHeading && gallery.getBoundingClientRect().top >= examplesSection.querySelector('.section-heading').getBoundingClientRect().bottom, 'examples have a labelled full-width heading before their gallery');
        const cards = [...gallery.children];
        const scale = frame.contentWindow.devicePixelRatio;
        for (const selector of ['.example-card-art', 'h3', 'strong']) {
          const positions = cards.map(card => Math.round(card.querySelector(selector).getBoundingClientRect().top * scale));
          assert(new Set(positions).size === 1, `example artwork, titles and actions align across the desktop row: ${selector}`);
        }
        // Earlier narrow/text-spacing cases can move the scroll anchor. This
        // checks the opening viewport, not that retained scroll position.
        frame.contentWindow.scrollTo(0, 0);
        await new Promise(resolve => requestAnimationFrame(resolve));
        const action = document.querySelector('[data-run]').getBoundingClientRect();
        assert(action.top >= 0 && action.bottom <= frame.contentWindow.innerHeight, 'wide Home keeps Run visible with its illustrated opening: ' + JSON.stringify({action:action.toJSON(),height:frame.contentWindow.innerHeight,scrollY:frame.contentWindow.scrollY}));
      }
      const footer = document.querySelector('.tabgrad-footer');
      for (const link of footer.querySelectorAll('nav a')) {
        assert(link.getBoundingClientRect().height >= 24, `footer navigation meets the 24 CSS px target minimum at ${width}px`);
      }
      for (const link of footer.querySelectorAll('a')) {
        const bounds = link.getBoundingClientRect();
        assert(bounds.left >= 0 && bounds.right <= document.documentElement.clientWidth, `footer links remain within the page at ${width}px`);
      }
      assert(!/Library v|Docs source \(preview\)/.test(footer.textContent), 'generic footer keeps technical build metadata in its relevant destination');
      if (path === '/docs/') {
        const source = document.querySelector('.docs-source [data-documentation-source]');
        assert(source && /\/blob\/[0-9a-f]{40}\/docs\/README\.md$/.test(source.href), 'documentation identifies its exact source independently of the playground package');
        assert(document.querySelector('.docs-source').textContent.includes('independently'), 'documentation explains the source/package distinction in context');
      }
      const intro = document.querySelector('.illustrated-intro');
      if (intro) {
        const story = intro.querySelector('.page-intro-story').getBoundingClientRect();
        const art = intro.querySelector('.page-intro-art').getBoundingClientRect();
        if (width >= 1120) {
          const contentTop = intro.getBoundingClientRect().top + parseFloat(frame.contentWindow.getComputedStyle(intro).paddingTop);
          assert(Math.abs(story.top - contentTop) < 1, `artwork does not displace the narrative start: ${path}`);
          assert(story.right <= art.left, `intro story and artwork have separate columns: ${path}`);
        } else assert(art.top >= story.bottom, `stacked artwork follows the complete story: ${path}`);
      }
      for (const row of document.querySelectorAll('.code-tabs, .run-actions')) {
        const children = [...row.children].filter((node) => node.getBoundingClientRect().height > 0);
        for (const child of children) assert(frame.contentWindow.getComputedStyle(child).marginTop === '0px', `prose margin displaces UI: ${path} at ${width}px`);
      }
      for (const tabs of document.querySelectorAll('.code-tabs')) {
        const [python, javascript] = [...tabs.children].map((node) => node.getBoundingClientRect());
        assert(python.top === javascript.top && python.height === javascript.height, `language tabs must align: ${path} at ${width}px`);
      }
      if (width === 1280) for (const grid of document.querySelectorAll('.hero, .split-section')) {
        const [left, right] = [...grid.children].map((node) => node.getBoundingClientRect());
        if (grid.classList.contains('hero')) {
          assert(left.bottom <= right.top && left.left === right.left && left.right === right.right, 'home promise and live example share a full-width alignment');
        } else assert(left.top === right.top, `shared editorial columns align: ${path}`);
      }
      if (path === '/docs/') {
        const routes = document.querySelectorAll('.docs-route');
        assert(routes.length === 4, 'documentation presents the four reader paths');
        for (let index = 0; index < routes.length; index += 2) {
          const left = routes[index], right = routes[index + 1];
          if (left.getBoundingClientRect().right <= right.getBoundingClientRect().left) {
            for (const selector of ['.sl-heading-wrapper', 'p', 'ul']) {
              assert(left.querySelector(selector).getBoundingClientRect().top === right.querySelector(selector).getBoundingClientRect().top, `documentation headings, descriptions and links align at ${width}px: ${selector}`);
            }
            if (width === 1280) {
              const leftLinks = left.querySelectorAll('ul > li'), rightLinks = right.querySelectorAll('ul > li');
              for (let row = 0; row < Math.min(leftLinks.length, rightLinks.length); row++) assert(leftLinks[row].getBoundingClientRect().top === rightLinks[row].getBoundingClientRect().top, 'documentation links keep a common rhythm when lists have different lengths');
            }
          }
        }
        const linkColor = frame.contentWindow.getComputedStyle(document.querySelector('#starlight__sidebar a[aria-current="page"]')).color;
        for (const route of routes) {
          const heading = route.querySelector('h2');
          const description = route.querySelector('p');
          assert(description.getBoundingClientRect().top > heading.getBoundingClientRect().bottom, 'documentation paths separate their title and explanation');
          for (const link of route.querySelectorAll('a')) assert(frame.contentWindow.getComputedStyle(link).color === linkColor, 'documentation paths use the shared link color');
        }
      }
      const emptyTitle = document.querySelector('.content-panel:has(.tabgrad-page-start)');
      assert(frame.contentWindow.getComputedStyle(emptyTitle.nextElementSibling).borderTopWidth === '0px', 'empty title wrapper does not duplicate the header separator');
      if (width === 320 || width === 1280) {
        // WCAG 1.4.12 override conditions, not prescribed authored typography.
        const saved = new Map([...document.body.querySelectorAll('*')].map((element) => [element, element.getAttribute('style')]));
        for (const element of saved.keys()) {
          element.style.setProperty('line-height', '1.5', 'important');
          element.style.setProperty('letter-spacing', '0.12em', 'important');
          element.style.setProperty('word-spacing', '0.16em', 'important');
          if (element.tagName === 'P') element.style.setProperty('margin-bottom', '2em', 'important');
        }
        frame.contentWindow.dispatchEvent(new Event('resize'));
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        assert(document.documentElement.scrollWidth <= document.documentElement.clientWidth, `text spacing must not cause page overflow: ${path} at ${width}px`);
        checkHeader(document, `${path} at ${width}px with increased text spacing`);
        await checkNavigation(document, `${path} at ${width}px with increased text spacing`);
        checkEditorToolbar(document, `${path} at ${width}px with increased text spacing`);
        checkRunControls(document, `${path} at ${width}px with increased text spacing`);
        if (document.querySelector('.run-editor')) {
          const editor = document.querySelector('.run-editor');
          const paint = document.querySelector('[data-syntax-layer]');
          assert(editor.scrollHeight <= editor.clientHeight, 'source remains visible with increased text spacing');
          assert(editor.getBoundingClientRect().height === paint.getBoundingClientRect().height, 'paint follows increased text spacing');
        }
        for (const [element, style] of saved) {
          if (style === null) element.removeAttribute('style'); else element.setAttribute('style', style);
        }
        frame.contentWindow.dispatchEvent(new Event('resize'));
      }
    }
  }
  for (const path of ['/', '/docs/']) {
    frame.src = path;
    await until(() => frame.contentWindow.location.pathname === path && frame.contentDocument?.readyState === 'complete' && frame.contentDocument.querySelector('.site-menu-toggle'), 'navigation resize page');
    for (const selector of ['.site-menu-toggle', ...(path === '/docs/' ? ['.docs-menu-toggle'] : [])]) {
      frame.style.width = '390px';
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const trigger = frame.contentDocument.querySelector(selector);
      const menu = trigger.popoverTargetElement;
      trigger.click();
      assert(menu.matches(':popover-open'), `navigation opens before resize: ${selector}`);
      frame.style.width = '1280px';
      await until(() => !menu.matches(':popover-open'), `resize closes a hidden navigation: ${selector}`);
    }
  }
  results.push({ name: "primary/project pages and documentation at ten widths, native navigation, responsive retirement, sidebar/code boundaries, non-overlapping controls and increased text spacing", passed: true, navigationFocus });
  await phase("runtime-finished");
  const report = { passed: true, cases: results };
  document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
  if (token) await fetch(`/__result?token=${encodeURIComponent(token)}`, { method: "POST", body: JSON.stringify(report) });
} catch (error) {
  const report = { passed: false, error: String(error), cases: results };
  document.querySelector("#result").textContent = JSON.stringify(report, null, 2);
  if (token) await fetch(`/__result?token=${encodeURIComponent(token)}`, { method: "POST", body: JSON.stringify(report) });
}
</script></html>
