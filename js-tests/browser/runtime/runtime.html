<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Tabgrad browser integration test</title>
  </head>
  <body>
    <script type="module">
      import { checkGradientProgress, loadGradientProgressOracle } from "/helpers/gradient-progress-cases.mjs";
      import { checkBackwardCase, isDirectBackwardCase } from "/helpers/backward-cases.mjs";
      import { checkSGDCase, isDirectSGDCase } from "/helpers/sgd-cases.mjs";
      import { checkSGDHostGuards, checkSGDFaults, checkSGDFixedOwners } from "/helpers/sgd-lifetime.mjs";
      import { checkBackwardLifetime, checkBackwardFaults, checkBackwardCleanup } from "/helpers/backward-lifetime.mjs";
      const parameters = new URLSearchParams(location.search);
      const token = parameters.get("token");
      const forceVariant = parameters.get("variant");

      async function reportPhase(phase) {
        const response = await fetch(`/__phase?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ phase }),
        });
        if (!response.ok) {
          throw new Error(`Could not report browser phase ${phase}.`);
        }
      }

      async function report(result) {
        await fetch(`/__result?token=${encodeURIComponent(token)}`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(result),
        });
      }

      async function checkIntermediateReuse(session) {
        const increment = session.tensor([1, 2, 3]);
        let root = session.tensor([0, 0, 0]);
        for (let index = 0; index < 32; index += 1) {
          const next = root.add(increment);
          root.close();
          root = next;
        }
        increment.close();
        const values = Array.from(await root.toArray());
        if (JSON.stringify(values) !== JSON.stringify([32, 64, 96])) {
          throw new Error("Intermediate reuse changed the numerical result.");
        }
        const diagnostics = session.diagnostics();
        if (diagnostics.highWaterAllocationBytes !== 36
          || diagnostics.highWaterReservedAllocationBytes !== 48) {
          throw new Error("Closed intermediates did not reuse the three-buffer working set.");
        }
        root.close();
        if (session.diagnostics().liveAllocationBytes !== 0) {
          throw new Error("Intermediate reuse left live allocations after close.");
        }
      }

      async function checkContiguousShapes(session) {
        for (const shape of [[], [1], [2, 3], [2, 1, 3], [2, 0], [0, 3]]) {
          const length = shape.reduce((count, dimension) => count * dimension, 1);
          const input = session.tensor(new Float32Array(length).fill(2), { shape });
          const result = input.add(input);
          input.close();
          const values = await result.toArray();
          if (JSON.stringify(result.shape) !== JSON.stringify(shape)
            || values.length !== length || !values.every((value) => value === 4)) {
            throw new Error("Contiguous tensor shape or element count was lost.");
          }
          result.close();
          if (session.diagnostics().liveTensorValues !== 0 || session.diagnostics().liveAllocationBytes !== 0) {
            throw new Error("Contiguous shape check retained tensor state.");
          }
        }
      }

      async function checkViews(session) {
        for (const shape of [[], [2, 3], [2, 0, 3]]) {
          const length = shape.reduce((count, dimension) => count * dimension, 1);
          const base = session.tensor(new Float32Array(length).fill(2));
          const view = base.view(shape);
          base.close();
          const sum = view.add(view);
          const flat = sum.view([-1]);
          sum.close(); view.close();
          const values = await flat.toArray();
          if (values.length !== length || !values.every((value) => value === 4)) {
            throw new Error("Shared view storage changed values.");
          }
          flat.close();
          if (session.diagnostics().liveAllocationBytes !== 0 || session.diagnostics().liveTensorValues !== 0) {
            throw new Error("View storage survived its final owner.");
          }
        }
      }

      async function checkTotalSum(session) {
        for (const shape of [[], [1], [2, 3], [2, 0, 3]]) {
          const length = shape.reduce((count, dimension) => count * dimension, 1);
          const input = session.tensor(new Float32Array(length).fill(2), { shape });
          const doubled = input.add(input);
          const flat = doubled.view([-1]);
          const result = flat.sum();
          input.close(); doubled.close(); flat.close();
          const values = await result.toArray();
          if (result.shape.length !== 0 || values.length !== 1 || values[0] !== 4 * length) {
            throw new Error("Total reduction lost input or output geometry.");
          }
          result.close();
          if (session.diagnostics().liveAllocationBytes !== 0 || session.diagnostics().liveTensorValues !== 0) {
            throw new Error("Total reduction retained resources.");
          }
        }
      }

      async function checkMultiplication(session) {
        for (const shape of [[], [1], [5], [2, 3], [2, 0, 3]]) {
          const length = shape.reduce((count, dimension) => count * dimension, 1);
          const input = session.tensor(new Float32Array(length).fill(-3), { shape });
          const alias = input.view(shape);
          const before = session.diagnostics().kernelCalls;
          const product = input.mul(alias);
          if (session.diagnostics().kernelCalls !== before) throw new Error("Multiplication ran during admission.");
          const doubled = product.add(product);
          const total = doubled.sum();
          input.close(); alias.close(); product.close(); doubled.close();
          if ((await total.toArray())[0] !== 18 * length) throw new Error("Mixed multiplication graph returned wrong values.");
          total.close();
        }
        const left = session.tensor([0, -0, 2 ** -149, Infinity, 1 + 2 ** -23]);
        const right = session.tensor([-2, 2, 0.5, 0, 1 - 2 ** -23]);
        const product = left.mul(right);
        const expected = [-0, -0, 0, NaN, 1];
        if (!(await product.toArray()).every((value, index) => Object.is(value, expected[index]))) {
          throw new Error("Multiplication numerical edge classification changed.");
        }
        left.close(); right.close(); product.close();
        if (session.diagnostics().liveTensorValues !== 0 || session.diagnostics().liveAllocationBytes !== 0
          || session.diagnostics().liveOperationRecords !== 0) throw new Error("Multiplication retained resources.");
      }

      async function checkNoGrad(session) {
        for (const shape of [[], [2], [2, 0, 3]]) {
          const count = shape.reduce((a, b) => a * b, 1);
          const input = session.tensor(new Float32Array(count).fill(2), { shape, requiresGrad: true });
          const square = input.mul(input);
          const total = square.sum();
          const view = session.noGrad(() => input.view(shape));
          const active = view.mul(view);
          const disabled = await session.noGrad(async () => {
            await Promise.resolve();
            return input.mul(input);
          });
          if (!view.requiresGrad || !active.requiresGrad || disabled.requiresGrad) {
            throw new Error("No-grad lost native arithmetic/view tracking.");
          }
          const seed = session.tensor(new Float32Array(count).fill(1), { shape });
          try { session.grad(active, [view], seed); throw new Error("Ghost input was connected."); }
          catch (error) { if (error.code !== "UNUSED_INPUT") throw error; }
          try { session.grad(view, [view], seed); throw new Error("Ghost root was differentiated."); }
          catch (error) { if (error.code !== "GRADIENT_NOT_TRACKED") throw error; }
          const [self] = session.grad(active, [active], seed);
          const [gradient] = session.noGrad(() => session.grad(total, [input]));
          if (!(await self.toArray()).every((value) => value === 1)
            || !(await gradient.toArray()).every((value) => value === 4)
            || !(await disabled.toArray()).every((value) => value === 4)) {
            throw new Error("No-grad changed derivative or forward values.");
          }
          for (const tensor of [input, square, total, view, active, disabled, seed, self, gradient]) tensor.close();
          if (session.diagnostics().liveDerivativeNodes !== 0 || session.diagnostics().liveSavedValues !== 0) {
            throw new Error("No-grad retained derivative owners.");
          }
        }
      }

      async function checkCopy(session) {
        for (const shape of [[], [2], [2, 0, 3]]) {
          const count = shape.reduce((a, b) => a * b, 1);
          const parameter = session.tensor(new Float32Array(count).fill(2), { shape, requiresGrad: true });
          const alias = parameter.view(shape);
          const rate = session.tensor(new Float32Array(count).fill(-0.25), { shape });
          for (let step = 0; step < 16; step++) {
            const square = parameter.mul(parameter);
            const loss = square.sum();
            const [gradient] = session.grad(loss, [parameter]);
            const scaled = session.noGrad(() => gradient.mul(rate));
            const next = session.noGrad(() => parameter.add(scaled));
            if (session.noGrad(() => parameter.copy_(next)) !== parameter) throw new Error("Copy changed handle identity.");
            for (const value of [square, loss, gradient, scaled, next]) value.close();
            if (!(await alias.toArray()).every(value => value === 2 ** -step)) throw new Error("Copy lost alias/current values.");
          }
          parameter.close(); alias.close(); rate.close();
          const source = session.tensor(new Float32Array(count).fill(3), { shape, requiresGrad: true });
          const plain = session.tensor(new Float32Array(count).fill(0), { shape });
          plain.copy_(source);
          const seed = session.tensor(new Float32Array(count).fill(1), { shape });
          const [result] = session.grad(plain, [source], seed);
          if (!(await result.toArray()).every(value => value === 1)) throw new Error("Copy lost active source edge.");
          for (const value of [plain, source, seed, result]) value.close();
          const state = session.diagnostics();
          if (state.liveTensorValues || state.liveDerivativeNodes || state.liveSavedValues || state.liveRequestLeases || state.liveAllocationBytes) {
            throw new Error("Copy retained completed owners.");
          }
        }
      }

      async function checkFunctionalGradients(session) {
        for (const shape of [[], [5], [2, 3], [2, 0, 3]]) {
          const length = shape.reduce((count, dimension) => count * dimension, 1);
          const input = session.tensor(new Float32Array(length).fill(2), { shape, requiresGrad: true });
          const square = input.mul(input);
          const sum = square.sum();
          const factor = session.tensor([3], { shape: [] });
          const loss = sum.mul(factor);
          square.close(); sum.close(); factor.close();
          await loss.toArray();
          const before = session.diagnostics();
          const [gradient, repeated] = session.grad(loss, [input, input]);
          if (session.diagnostics().kernelCalls !== before.kernelCalls
            || session.diagnostics().wasmToHostCopies !== before.wasmToHostCopies) {
            throw new Error("Functional differentiation observed numerical data.");
          }
          input.close(); loss.close();
          for (const result of [gradient, repeated]) {
            const values = await result.toArray();
            if (result.requiresGrad || values.length !== length || !values.every((value) => value === 12)
              || JSON.stringify(result.shape) !== JSON.stringify(shape)) {
              throw new Error("Functional gradients lost values, shape or first-order tracking.");
            }
            result.close();
          }
          const after = session.diagnostics();
          if (after.liveDerivativeNodes !== 0 || after.liveSavedValues !== 0
            || after.liveTensorValues !== 0 || after.liveAllocationBytes !== 0) {
            throw new Error("Functional gradient cycle retained live state.");
          }
        }
      }

      try {
        await reportPhase("application-started");
        const [{ createRuntimeSession }, { createTestRuntimeSession, getTestRuntimeSemanticOwnership, getTestRuntimeOwnership, getTestTensorVersion }] = await Promise.all([
          import("/index.js"),
          import("/testing.js"),
        ]);
        await reportPhase("assets-loaded");
        const manifestUrl = new URL("/manifest.json", location.href);
        await reportPhase("runtime-started");
        const session = forceVariant === "auto"
          ? createRuntimeSession({ manifestUrl })
          : createTestRuntimeSession({ manifestUrl, forceVariant });
        const left = session.tensor([1, 2, 3]);
        const right = session.tensor([4, 5, 6]);
        const result = left.add(right);
        const before = session.diagnostics();
        const values = Array.from(await result.toArray());
        const after = session.diagnostics();
        left.close();
        right.close();
        result.close();
        await checkIntermediateReuse(session);
        await checkContiguousShapes(session);
        await checkViews(session);
        await checkTotalSum(session);
        await checkMultiplication(session);
        await checkFunctionalGradients(session);
        for (const fixture of (await loadGradientProgressOracle()).gradientProgressCases) {
          await checkGradientProgress(session, fixture);
        }
        const backwardOracle = await (await fetch('/helpers/python-copy-oracle.json')).json();
        for (const fixture of backwardOracle.backwardCases.filter(isDirectBackwardCase)) {
          await checkBackwardCase(session, fixture, getTestTensorVersion);
        }
        for (const fixture of backwardOracle.sgdCases.filter(isDirectSGDCase)) {
          await checkSGDCase(session, fixture, getTestTensorVersion);
        }
        await checkBackwardLifetime(session, getTestRuntimeSemanticOwnership);
        await checkBackwardFaults(options => createTestRuntimeSession({ manifestUrl,
          forceVariant: forceVariant === 'auto' ? 'simd128' : forceVariant, ...options }));
        const [{ WebAssemblyCpuBackend }, { ExecutionTicket }] = await Promise.all([
          import('/backends/cpu/cpu-backend.js'), import('/execution/execution-ticket.js'),
        ]);
        const createSGDSession = options => createTestRuntimeSession({ manifestUrl, forceVariant: forceVariant === 'auto' ? 'simd128' : forceVariant, ...options });
        await checkSGDHostGuards(createSGDSession, getTestTensorVersion);
        await checkSGDFaults(createSGDSession, getTestTensorVersion, getTestRuntimeOwnership, getTestRuntimeSemanticOwnership, WebAssemblyCpuBackend);
        for (const length of [32, 4096, 65536]) await checkSGDFixedOwners(session, length, getTestRuntimeOwnership, getTestRuntimeSemanticOwnership);
        await checkBackwardCleanup(options => createTestRuntimeSession({ manifestUrl,
          forceVariant: forceVariant === 'auto' ? 'simd128' : forceVariant, ...options }), WebAssemblyCpuBackend, ExecutionTicket, getTestRuntimeSemanticOwnership);
        await checkNoGrad(session);
        await checkCopy(session);
        await session.close();
        await reportPhase("runtime-finished");
        await report({ ok: true, before, after, values });
      } catch (error) {
        await report({
          ok: false,
          error: {
            code: error?.code,
            message: error instanceof Error ? error.message : String(error),
            stack: error instanceof Error ? error.stack : undefined,
          },
        });
      }
    </script>
  </body>
</html>
