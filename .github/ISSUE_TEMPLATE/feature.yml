name: Feature proposal
description: Define a bounded new capability.
labels:
- 'type: feature'
body:
- type: markdown
  attributes:
    value: Search open and closed issues and PRs before submitting. Include only relevant
      evidence and risks. Never publish credentials, private configuration or vulnerability
      details; follow SECURITY.md for private reporting.
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: Explain the need and its concrete impact, with the facts already known.
  validations:
    required: true
- type: textarea
  id: expected-result
  attributes:
    label: Expected result
    description: Describe the result, included/excluded scope, behavior to preserve and any
      material effects, risks or unresolved decisions. Omit unrelated N/A catalogues.
  validations:
    required: true
- type: textarea
  id: completion-conditions
  attributes:
    label: Completion conditions
    description: List observable conditions that demonstrate the result; avoid generic implementation
      activities.
  validations:
    required: true
- type: textarea
  id: dependencies-related-work
  attributes:
    label: Dependencies and related work
    description: Record the open/closed issue and PR search, relevant links and their relationship.
      Identify any parent or blocking dependency; say when none was found.
  validations:
    required: true
- type: textarea
  id: behavior-contract
  attributes:
    label: Behavior and reference
    description: Give a motivating example, proposed public interface, supported and deferred
      behavior, and applicable PyTorch reference. Identify material choices still needing
      a decision.
  validations:
    required: true
