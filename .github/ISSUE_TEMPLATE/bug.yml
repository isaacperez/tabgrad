name: Bug report
description: Report incorrect existing behavior.
labels:
- 'type: bug'
body:
- type: markdown
  attributes:
    value: Search open and closed issues and PRs before submitting. Include only relevant
      evidence and risks. Never publish credentials, private configuration or vulnerability
      details; follow SECURITY.md for private reporting.
- type: textarea
  id: problem
  attributes:
    label: Problem
    description: Explain the need and its concrete impact, with the facts already known.
  validations:
    required: true
- type: textarea
  id: expected-result
  attributes:
    label: Expected result
    description: Describe the result, included/excluded scope, behavior to preserve and any
      material effects, risks or unresolved decisions. Omit unrelated N/A catalogues.
  validations:
    required: true
- type: textarea
  id: completion-conditions
  attributes:
    label: Completion conditions
    description: List observable conditions that demonstrate the result; avoid generic implementation
      activities.
  validations:
    required: true
- type: textarea
  id: dependencies-related-work
  attributes:
    label: Dependencies and related work
    description: Record the open/closed issue and PR search, relevant links and their relationship.
      Identify any parent or blocking dependency; say when none was found.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Reproduction and behavior
    description: Give the smallest reproduction, actual output/errors, expected behavior and
      its authoritative source. State whether it worked before when known.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Version and relevant environment
    description: 'Identify the version/commit and environment needed to reproduce: browser,
      OS, backend or hardware when relevant. Keep credentials and private configuration out.'
  validations:
    required: true
