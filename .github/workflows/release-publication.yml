name: Release publication
'on':
  workflow_dispatch:
    inputs:
      plan_json:
        description: Canonical separately inspected closed publication plan
        required: true
        type: string
      plan_sha256:
        description: Independently inspected canonical plan SHA-256
        required: true
        type: string
      notes:
        description: Approved public release notes
        required: true
        type: string
      qualification_json:
        description: Identified same-candidate CPU and declared physical GPU reports
        required: true
        type: string
      receipt_issue:
        description: Approved issue for public-safe bootstrap or physical consumer receipt
        required: true
        type: string
      confirmation:
        description: Enter release-publication after separate operational authorization
        required: true
        type: string
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: tabgrad-release-publication
  cancel-in-progress: false
env:
  TABGRAD_PUBLICATION_ENABLED: ${{ vars.TABGRAD_PUBLICATION_ENABLED }}
  TABGRAD_PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
  TABGRAD_PUBLICATION_PLAN_JSON: ${{ inputs.plan_json }}
  TABGRAD_PUBLICATION_PLAN_SHA256: ${{ inputs.plan_sha256 }}
  TABGRAD_PUBLICATION_NOTES: ${{ inputs.notes }}
  TABGRAD_PUBLICATION_QUALIFICATION_JSON: ${{ inputs.qualification_json }}
  TABGRAD_RECEIPT_ISSUE: ${{ inputs.receipt_issue }}
  TABGRAD_RELEASE_POLICY_JSON: ${{ vars.TABGRAD_RELEASE_POLICY_JSON }}
  TABGRAD_RELEASE_POLICY_SHA256: ${{ vars.TABGRAD_RELEASE_POLICY_SHA256 }}
  TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ vars.TABGRAD_RELEASE_QUALIFICATION_JSON }}
jobs:
  precheck:
    name: precheck-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs precheck "$RUNNER_TEMP/tabgrad-publication"
    env:
      GH_TOKEN: ${{ github.token }}
    if: ${{ vars.TABGRAD_PUBLICATION_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.confirmation == 'release-publication' }}
    outputs:
      data_id: ${{ steps.role.outputs.data_id }}
      proofs_id: ${{ steps.role.outputs.proofs_id }}
      verification_id: ${{ steps.role.outputs.verification_id }}
      producer_run: ${{ steps.role.outputs.producer_run }}
      history_id: ${{ steps.role.outputs.history_id }}
      history_run: ${{ steps.role.outputs.history_run }}
      mode: ${{ steps.role.outputs.mode }}
      approval: ${{ steps.role.outputs.approval }}
  admit:
    name: admit-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
    - precheck
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Select Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11.9
        check-latest: false
    - name: Prepare locked Python tooling
      run: 'python -m venv .venv && .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock'
    - name: Prepare identified proof verifier
      run: .venv/bin/python scripts/prepare_provenance_client.py "$RUNNER_TEMP/tabgrad-provenance-client"
    - name: Receive identified producer data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.data_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/data
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer proofs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.proofs_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/proofs
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer corroboration
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.verification_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/verification
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive separately enrolled original history
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.history_id }}
        run-id: ${{ needs.precheck.outputs.history_run }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/initial-history
        digest-mismatch: error
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs admit "$RUNNER_TEMP/tabgrad-publication"
      env:
        TABGRAD_RECORD_INPUT: ${{ runner.temp }}/tabgrad-publication/initial-history
        TABGRAD_PROVENANCE_CLIENT: ${{ runner.temp }}/tabgrad-provenance-client/gh
    - name: Preserve admission and available original history
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-admission-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
    environment: tabgrad-npm-publication
    permissions:
      contents: write
      actions: read
      issues: read
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
      admission_sha: ${{ steps.role.outputs.admission_sha }}
  npm:
    name: publish-approved-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
    - precheck
    - admit
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Select Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11.9
        check-latest: false
    - name: Prepare locked Python tooling
      run: 'python -m venv .venv && .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock'
    - name: Prepare the isolated npm publishing client
      run: .venv/bin/python scripts/prepare_publication_client.py "$RUNNER_TEMP/tabgrad-publication-client"
    - name: Receive identified producer data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.data_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/data
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer proofs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.proofs_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/proofs
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer corroboration
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.verification_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/verification
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive admitted publication input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/admission
        digest-mismatch: error
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs npm "$RUNNER_TEMP/tabgrad-publication"
      env:
        TABGRAD_RECORD_INPUT: ${{ runner.temp }}/tabgrad-publication/admission/evidence
        TABGRAD_PUBLICATION_CLIENT: ${{ runner.temp }}/tabgrad-publication-client
    - name: Preserve the sanitized npm call outcome
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-npm-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
      TABGRAD_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
      TABGRAD_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
    if: ${{ needs.precheck.outputs.mode == 'oidc' }}
    permissions:
      contents: read
      actions: read
      issues: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  bootstrap:
    name: observe-human-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
    - precheck
    - admit
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Receive identified producer data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.data_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/data
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer proofs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.proofs_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/proofs
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer corroboration
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.verification_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/verification
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive admitted publication input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/admission
        digest-mismatch: error
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs bootstrap "$RUNNER_TEMP/tabgrad-publication"
    - name: Preserve the attributed human reconciliation
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-npm-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
      TABGRAD_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
      TABGRAD_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
    if: ${{ needs.precheck.outputs.mode == 'bootstrap' }}
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  observe:
    name: record-npm-outcome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
    - precheck
    - admit
    - npm
    - bootstrap
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Receive admitted publication input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/admission
        digest-mismatch: error
    - name: Receive the actual npm actor outcome
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.npm.outputs.artifact_id || needs.bootstrap.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/npm-result
        digest-mismatch: error
      if: ${{ needs.npm.outputs.artifact_id != '' || needs.bootstrap.outputs.artifact_id != '' }}
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs observe "$RUNNER_TEMP/tabgrad-publication"
      env:
        TABGRAD_RECORD_INPUT: ${{ runner.temp }}/tabgrad-publication/admission/evidence
    - name: Preserve the recorded outcome and original history
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-observation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
      TABGRAD_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
      TABGRAD_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      TABGRAD_NPM_RESULT_ID: ${{ needs.npm.outputs.artifact_id || needs.bootstrap.outputs.artifact_id }}
      TABGRAD_NPM_RESULT_DIGEST: ${{ needs.npm.outputs.digest || needs.bootstrap.outputs.digest }}
      TABGRAD_NPM_JOB_RESULT: ${{ needs.precheck.outputs.mode == 'bootstrap' && needs.bootstrap.result || needs.npm.result }}
    if: ${{ always() && !cancelled() && needs.admit.result == 'success' }}
    permissions:
      contents: write
      actions: read
      issues: read
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  consume:
    name: verify-published-consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs:
    - precheck
    - admit
    - observe
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Select the consumer npm
      run: npm install --global npm@11.1.0 --ignore-scripts --no-audit --no-fund
    - name: Prepare locked consumer dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Receive identified producer data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.data_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/data
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer proofs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.proofs_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/proofs
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer corroboration
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.verification_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/verification
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive admitted publication input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/admission
        digest-mismatch: error
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs consume "$RUNNER_TEMP/tabgrad-publication"
    - name: Preserve actual registry and consumer checks
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-consumers-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
      TABGRAD_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
      TABGRAD_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
    outputs:
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
      digest: ${{ steps.retained.outputs.artifact-digest }}
  complete:
    name: complete-github-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
    - precheck
    - admit
    - observe
    - consume
    steps:
    - name: Check out the reviewed recipe
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Select the controller Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        check-latest: false
    - name: Receive identified producer data
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.data_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/data
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer proofs
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.proofs_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/proofs
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive original producer corroboration
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.precheck.outputs.verification_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/verification
        digest-mismatch: error
        run-id: ${{ needs.precheck.outputs.producer_run }}
    - name: Receive admitted publication input
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.admit.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/admission
        digest-mismatch: error
    - name: Receive observed original history
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.observe.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/observed
        digest-mismatch: error
    - name: Receive actual consumer qualification
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ needs.consume.outputs.artifact_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/tabgrad-publication/consumers
        digest-mismatch: error
    - name: Run the maintained publication role
      id: role
      run: node scripts/release-publication.mjs complete "$RUNNER_TEMP/tabgrad-publication"
      env:
        TABGRAD_RECORD_INPUT: ${{ runner.temp }}/tabgrad-publication/observed/evidence
    - name: Preserve final or partial completion and original history
      id: retained
      if: ${{ always() && steps.role.outcome != 'skipped' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: tabgrad-publication-completion-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/tabgrad-publication/public-output
        overwrite: false
        if-no-files-found: error
        retention-days: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_ADMISSION_ID: ${{ needs.admit.outputs.artifact_id }}
      TABGRAD_ADMISSION_DIGEST: ${{ needs.admit.outputs.digest }}
      TABGRAD_ADMISSION_SHA256: ${{ needs.admit.outputs.admission_sha }}
      TABGRAD_CONSUMERS_ID: ${{ needs.consume.outputs.artifact_id }}
      TABGRAD_CONSUMERS_DIGEST: ${{ needs.consume.outputs.digest }}
    permissions:
      contents: write
      actions: read
      issues: read
