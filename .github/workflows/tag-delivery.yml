name: Coordinate tag delivery
run-name: Tag delivery ${{ github.event.workflow_run.id }}

'on':
  workflow_run:
    workflows: ['Tag release request']
    types: [completed]

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: tabgrad-tag-delivery
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch-tag-delivery
    if: vars.TABGRAD_TAG_DELIVERY_ENABLED == 'true' && github.run_attempt == '1' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TABGRAD_TAG_DELIVERY_ENABLED: ${{ vars.TABGRAD_TAG_DELIVERY_ENABLED }}
      TABGRAD_PUBLICATION_ENABLED: ${{ vars.TABGRAD_PUBLICATION_ENABLED }}
      TABGRAD_RELEASE_POLICY_JSON: ${{ secrets.TABGRAD_RELEASE_POLICY_JSON }}
      TABGRAD_RELEASE_POLICY_SHA256: ${{ secrets.TABGRAD_RELEASE_POLICY_SHA256 }}
      TABGRAD_RELEASE_QUALIFICATION_JSON: ${{ secrets.TABGRAD_RELEASE_QUALIFICATION_JSON }}
    steps:
      - name: Check out only the default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the admitted controller Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Select the original approved readiness
        id: selection
        run: node scripts/tag-delivery.mjs select "$RUNNER_TEMP/tabgrad-tag-delivery"
      - name: Receive approved data without executing it
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.selection.outputs.readiness_id }}
          run-id: ${{ steps.selection.outputs.readiness_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tabgrad-tag-delivery/candidate-ready
          digest-mismatch: error
      - name: Selected candidate ${{ steps.selection.outputs.readiness_sha256 }} ${{ steps.selection.outputs.tag_object }}
        run: test -n "$READINESS_SHA"
        env:
          READINESS_SHA: ${{ steps.selection.outputs.readiness_sha256 }}
      - name: Dispatch the frozen approved release once
        id: dispatch
        run: node scripts/tag-delivery.mjs dispatch "$RUNNER_TEMP/tabgrad-tag-delivery"
      - name: Dispatched release ${{ steps.dispatch.outputs.run_id }} ${{ steps.dispatch.outputs.plan_sha256 }} ${{ steps.dispatch.outputs.tag_object }} ${{ steps.dispatch.outputs.readiness_sha256 }}
        run: test -n "$RELEASE_RUN"
        env:
          RELEASE_RUN: ${{ steps.dispatch.outputs.run_id }}
      - name: Preserve the intent and known or unknown dispatch result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabgrad-tag-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tabgrad-tag-delivery/public-output
          if-no-files-found: ignore
          overwrite: false
          retention-days: 90
