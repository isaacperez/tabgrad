name: Website checks

on:
  pull_request:
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/brand/**'
      - 'README.md'
      - 'scripts/browser-harness.mjs'
      - '.github/workflows/website-checks.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'assets/brand/**'
      - 'README.md'
      - 'scripts/browser-harness.mjs'
      - '.github/workflows/website-checks.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Prepare and request protected website publication
        type: boolean
        default: false
      rollback:
        description: Explicitly restore the reference website after a release-bound delivery
        type: boolean
        default: false
      completion_id:
        description: Completed release artifact ID for a site-only recovery
        type: string
      completion_digest:
        description: Completed release artifact SHA256 for site-only recovery
        type: string
      completion_sha256:
        description: Completed descriptor SHA256 for site-only recovery
        type: string
      completion_run:
        description: Original completed publisher run for site-only recovery
        type: string
      initial:
        description: First publication only; requires separate operational authorization
        type: boolean
        default: false

  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true
      completion_id:
        type: string
        required: true
      completion_digest:
        type: string
        required: true
      completion_sha256:
        type: string
        required: true
      completion_run:
        type: string
        required: true
    secrets:
      TABGRAD_HOST_CONFIG_JSON:
        required: true
      TABGRAD_WEBSITE_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: website-${{ inputs.publish && 'publication' || github.ref }}
  cancel-in-progress: ${{ !(inputs.publish) }}

jobs:
  website:
    name: website
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      delivery_sha256: ${{ steps.delivery.outputs.delivery_sha256 }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CHROME_DEVEL_SANDBOX: /opt/google/chrome/chrome-sandbox
      WRANGLER_SEND_METRICS: 'false'
      TABGRAD_WEBSITE_MODE: ${{ inputs.publish && 'publish' || 'check' }}
      TABGRAD_WEBSITE_ENABLED: ${{ vars.TABGRAD_WEBSITE_ENABLED }}
      TABGRAD_WEBSITE_RELEASE_RECOVERY: ${{ github.workflow_ref == format('{0}/.github/workflows/website-checks.yml@refs/heads/main', github.repository) && inputs.completion_id != '' && 'true' || 'false' }}
      TABGRAD_WEBSITE_ROLLBACK: ${{ inputs.rollback && 'true' || 'false' }}
      TABGRAD_WEBSITE_INITIAL: ${{ inputs.initial && 'true' || 'false' }}
      TABGRAD_SITE_URL: ${{ inputs.publish && vars.TABGRAD_SITE_URL || 'https://example.invalid/' }}
    steps:
      - name: Check out website and documentation sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the registry acquisition Node
        if: inputs.completion_id != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Select the registry acquisition npm
        if: inputs.completion_id != ''
        run: npm install --global npm@11.1.0 --ignore-scripts --no-audit --no-fund
      - name: Receive the identified successful release completion
        if: inputs.completion_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.completion_id }}
          run-id: ${{ inputs.completion_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tabgrad-site-completion
          digest-mismatch: error
      - name: Admit completion and acquire the exact registry runtime
        if: inputs.completion_id != ''
        id: released
        run: node scripts/release-website.mjs "$RUNNER_TEMP/tabgrad-site-completion/site-completion.json" "$RUNNER_TEMP/tabgrad-site-runtime"
        env:
          TABGRAD_WEBSITE_RELEASE_RECOVERY: ${{ github.workflow_ref == format('{0}/.github/workflows/website-checks.yml@refs/heads/main', github.repository) && inputs.completion_id != '' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          TABGRAD_COMPLETION_ID: ${{ inputs.completion_id }}
          TABGRAD_COMPLETION_DIGEST: ${{ inputs.completion_digest }}
          TABGRAD_COMPLETION_SHA256: ${{ inputs.completion_sha256 }}
      - name: Check out exactly the released website and Markdown
        if: inputs.completion_id != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.released.outputs.source_revision }}
          persist-credentials: false
      - name: Select the acquired runtime for every website consumer
        if: inputs.completion_id != ''
        run: echo "TABGRAD_WEBSITE_RELEASE_INPUT=$RELEASE_INPUT" >> "$GITHUB_ENV"
        env:
          RELEASE_INPUT: ${{ steps.released.outputs.release_input }}
      - name: Select the website Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: website/.node-version
          check-latest: false
      - name: Admit the explicit preparation context
        run: node website/hosting/scripts/ci-context.mjs
      - name: Select the pinned npm
        run: npm install --global npm@11.1.0 --ignore-scripts --no-audit --no-fund
      - name: Install website dependencies without lifecycle scripts
        run: npm ci --prefix website --ignore-scripts --no-audit --no-fund
      - name: Install the isolated locked hosting tools without lifecycle scripts
        run: npm ci --prefix website/hosting --ignore-scripts --no-audit --no-fund
      - name: Prepare the locked diagram browser explicitly
        run: npm exec --prefix website -- puppeteer browsers install chrome
      - name: Prepare the installed Chrome sandbox helper
        run: |
          test -f "$CHROME_DEVEL_SANDBOX"
          test -x "$CHROME_DEVEL_SANDBOX"
          test ! -L "$CHROME_DEVEL_SANDBOX"
          test "$(stat -c '%u' "$CHROME_DEVEL_SANDBOX")" = 0
          sudo chmod 4755 "$CHROME_DEVEL_SANDBOX"
          test -u "$CHROME_DEVEL_SANDBOX"
      - name: Check website types and generated content
        run: npm --prefix website run check
      - name: Test website source and serving contracts
        run: npm --prefix website test
      - name: Build the static website and search index
        run: npm --prefix website run build
      - name: Verify emitted links, diagrams and runtime bytes
        run: npm --prefix website run verify
      - name: Capture only the current public immutable predecessor
        if: env.TABGRAD_WEBSITE_MODE == 'publish' && !inputs.initial
        run: node website/hosting/scripts/predecessor.mjs website/dist website/.generated/previous
      - name: Prepare the exact static delivery from the verified output
        id: delivery
        run: |
          if test -d website/.generated/previous; then
            node website/hosting/scripts/prepare.mjs website/dist website/.generated/delivery website/.generated/previous
          else
            node website/hosting/scripts/prepare.mjs website/dist website/.generated/delivery
          fi
      - name: Test native response policies, identity, retention and inert publication
        run: npm --prefix website/hosting test
      - name: Test real CPU examples and search through native serving in Chrome and Firefox
        run: npm --prefix website/hosting run test:browser
      - name: Preserve the checked payload for the protected publisher
        if: env.TABGRAD_WEBSITE_MODE == 'publish'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-delivery
          path: website/.generated/delivery/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

  website-publication:
    name: website-publication
    needs: website
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.completion_id != '' && github.workflow_ref == format('{0}/.github/workflows/release-publication.yml@refs/heads/main', github.repository) && 'website-tag-publication' || 'website-publication' }}
    steps:
      - name: Check out the same reviewed publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the website Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version-file: website/.node-version
          check-latest: false
      - name: Select the pinned npm
        run: npm install --global npm@11.1.0 --ignore-scripts --no-audit --no-fund
      - name: Install only locked hosting dependencies
        run: npm ci --prefix website/hosting --ignore-scripts --no-audit --no-fund
      - name: Download the payload checked in this same run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-delivery
          path: website/.generated/delivery
      - name: Receive the original completed release for final admission
        if: inputs.completion_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.completion_id }}
          run-id: ${{ inputs.completion_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tabgrad-site-completion
          digest-mismatch: error
      - name: Verify identity again and publish once after approval
        env:
          TABGRAD_WEBSITE_RELEASE_RECOVERY: ${{ github.workflow_ref == format('{0}/.github/workflows/website-checks.yml@refs/heads/main', github.repository) && inputs.completion_id != '' && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          TABGRAD_WEBSITE_COMPLETION: ${{ runner.temp }}/tabgrad-site-completion/site-completion.json
          TABGRAD_COMPLETION_ID: ${{ inputs.completion_id }}
          TABGRAD_COMPLETION_DIGEST: ${{ inputs.completion_digest }}
          TABGRAD_COMPLETION_SHA256: ${{ inputs.completion_sha256 }}
          TABGRAD_WEBSITE_ENABLED: ${{ vars.TABGRAD_WEBSITE_ENABLED }}
          TABGRAD_WEBSITE_MODE: publish
          TABGRAD_WEBSITE_INITIAL: ${{ inputs.initial && 'true' || 'false' }}
          TABGRAD_SITE_URL: ${{ vars.TABGRAD_SITE_URL }}
          TABGRAD_DELIVERY_SHA256: ${{ needs.website.outputs.delivery_sha256 }}
          TABGRAD_HOST_CONFIG_JSON: ${{ secrets.TABGRAD_HOST_CONFIG_JSON }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.TABGRAD_WEBSITE_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
        run: node website/hosting/scripts/publisher.mjs website/.generated/delivery website/.generated/publication-receipt.json
      - name: Preserve the bounded public result even after an uncertain call
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-publication-result
          path: website/.generated/publication-receipt.json
          if-no-files-found: ignore
          retention-days: 30
